const B=data.local.map(BigInt),square=data.sq.map(BigInt);
const ctx=el.view.getContext('2d');
const tau=Math.PI*2;
const params={local:[0,square.length-1,94],crt:[0,3,3],repair:[0,1,1]};
const degrees={local:94,crt:3,repair:1};
let scene='local',yaw=-.49,pitch=.34,drawn=[],drag=null;
function save(){const a=window.openai;if(a?.setWidgetState)a.setWidgetState({modelContent:{scene,selection:degrees[scene]},privateContent:{yaw,pitch}})?.catch(()=>{});}
function apply(state){
 const m=state?.modelContent,p=state?.privateContent;
 if(m&&Object.hasOwn(params,m.scene)){scene=m.scene;if(Number.isInteger(m.selection))degrees[scene]=Math.max(params[scene][0],Math.min(params[scene][1],m.selection));}
 if(Number.isFinite(p?.yaw))yaw=p.yaw;
 if(Number.isFinite(p?.pitch))pitch=Math.max(-.98,Math.min(.98,p.pitch));
 el.scene.value=scene; refresh();
}
function palette(key,fallback){
 const probe=document.createElement('span');probe.style.color='var('+key+','+fallback+')';root.append(probe);
 const value=getComputedStyle(probe).color;probe.remove();return value;
}
function legend(items){el.legend.replaceChildren(...items.map(([shape,text])=>{const item=document.createElement('span');item.className='ss-key text-small';const mark=document.createElement('i');mark.className='ss-'+shape;mark.setAttribute('aria-hidden','true');item.append(mark,document.createTextNode(text));return item;}));}
function refresh(){
 const v=degrees[scene],[lo,hi]=params[scene];el.slider.min=lo;el.slider.max=hi;el.slider.value=v;
 if(scene==='local'){
  legend([['dot','Nonzero coefficient'],['ring','Zero coefficient'],['square','Selected degree']]);
  let pos=0n,neg=0n,count=0;
  for(let i=0;i<B.length;i++){const j=v-i;if(j<0||j>=B.length)continue;const term=B[i]*B[j];if(term>0n)pos+=term;if(term<0n)neg-=term;if(term)count++;}
  el.label.textContent='Square coefficient';el.value.textContent='k = '+v;el.stat.textContent='Degree '+v+' · '+count+' nonzero products · '+pos.toLocaleString('en-US')+' − '+neg.toLocaleString('en-US')+' = '+square[v].toLocaleString('en-US');
  el.detail.textContent='Period 7. Each turn holds seven degrees. All coefficients of B² at residues 3 and 4 vanish on every turn.';
 }else if(scene==='crt'){
  legend([['dot','Allowed residue triple'],['ring','Excluded by a local square']]);
  const possible=[385,231,165,105][v];
  el.label.textContent='Active local masks';el.value.textContent=v+' of 3';el.stat.textContent=possible+' of 385 residue triples remain possible for the square.';
  el.detail.textContent='Each axis is one local residue digit, modulo 5, 7 or 11. A forbidden digit rules out the whole triple. In the proof, 128 prime periods act together.';
 }else{
  legend([['dot','Already nonzero'],['ring','Missing before repair'],['square','Gap filled by repair']]);
  const before=[...data.base].filter(x=>x==='1').length,total=data.degree+1;
  el.label.textContent='Endpoint correction';el.value.textContent=v?'Applied':'Off';
  el.stat.textContent=(v?total:before).toLocaleString('en-US')+' of '+total.toLocaleString('en-US')+' positions occupied'+(v?' · every gap is filled.':' · '+(total-before)+' gaps before repair.');
  el.detail.textContent='Degree-1,168 control. Read 35 degrees per turn. The correction acts on degrees 0–503 and 665–1,168. This small example demonstrates density only.';

 el.view.setAttribute('aria-label',el.stat.textContent+' '+el.detail.textContent);render();
}
function render(){
 const W=el.view.clientWidth,H=el.view.clientHeight;if(!W||!H)return;
 const ratio=Math.min(window.devicePixelRatio||1,2);el.view.width=W*ratio;el.view.height=H*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);
 const fg=palette('--foreground','#172d32'),muted=palette('--muted-foreground','#516267'),line=palette('--border','#cbd3d0'),primary=palette('--viz-series-1','#00746b'),second=palette('--viz-series-2','#a34c24'),bg=palette('--background','#faf9f4');
 const s=Math.min(W*.276,H*.305),cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 function project(x,y,z){const u=x*cy+z*sy,d=-x*sy+z*cy;return [W/2+s*u,H*.50-s*(y*cp-d*sp),d*cp+y*sp];}
 function path(pts,color,opacity=1){ctx.globalAlpha=opacity;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();pts.forEach(([x,y,z],i)=>{const q=project(x,y,z);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});ctx.stroke();ctx.globalAlpha=1;}
 function label(x,y,z,t){const [u,v]=project(x,y,z);ctx.fillStyle=fg;ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(t,Math.max(37,Math.min(W-37,u)),Math.max(12,Math.min(H-3,v)));}
 const marks=[],labels=[];const v=degrees[scene];
 function dot(x,y,z,type,r,index){marks.push({p:project(x,y,z),type,r,index});}
 if(scene==='crt'){
  const side=1.02;for(let h of [-side,side])path([[-side,h,-side],[side,h,-side],[side,h,side],[-side,h,side],[-side,h,-side]],line);
  for(let x of [-side,side])for(let z of [-side,side])path([[x,-side,z],[x,side,z]],line);
  for(let z=0;z<11;z++)for(let y=0;y<7;y++)for(let x=0;x<5;x++){
   const allowed=(v<1||!(x===2||x===3))&&(v<2||!(y===3||y===4))&&(v<3||z<4||z>7);
   dot((x/2-1)*.91,(y/3-1)*.91,(z/5-1)*.91,allowed?'solid':'hole',Math.max(2.1,Math.min(4.2,s*.038)),[x,y,z]);
  }
  labels.push([0,-1.26,-1.08,'mod 5'],[-1.2,0,-1.15,'mod 7'],[1.17,-1.18,.22,'mod 11']);
 }else{
  const local=scene==='local',per=local?7:35,total=local?square.length:data.degree+1,top=Math.floor((total-1)/per);
  const half=local?1.12:1.18,rad=local?.94:.84;
  const level=q=>half*(2*q/top-1);
  function ring(q){const pts=[];for(let a=0;a<=60;a++)pts.push([rad*Math.cos(a*tau/60),level(q),rad*Math.sin(a*tau/60)]);path(pts,line,.62);}
  for(let q=0;q<=top;q+=local?3:7)ring(q);if(top%(local?3:7))ring(top);
  for(let j=0;j<per;j+=local?1:5){const a=j*tau/per;path([[rad*Math.cos(a),-half,rad*Math.sin(a)],[rad*Math.cos(a),half,rad*Math.sin(a)]],line,.7);}
  for(let k=0;k<total;k++){const j=k%per,q=Math.floor(k/per),a=j*tau/per;
   const type=local?(k===v?'selected':square[k]===0n?'zero':'solid'):(data.base[k]==='1'?'solid':v?'fixed':'zero');
   dot(rad*Math.cos(a),level(q),rad*Math.sin(a),type,local?4.7:2.6,k);
  }
  if(local){for(let j=0;j<7;j++){const a=j*tau/7;labels.push([1.12*Math.cos(a),half+.10,1.12*Math.sin(a),String(j)]);}}
 }
 drawn=marks.sort((a,b)=>a.p[2]-b.p[2]);
 function paint(m){const [x,y,z]=m.p,kind=m.type,r=m.r;
  ctx.globalAlpha=kind==='hole'?.14:kind==='selected'?1:Math.min(1,Math.max(.40,.73+z*.20));
  if(kind==='selected'||kind==='fixed'){ctx.fillStyle=second;const width=kind==='selected'?r*2.55:r*1.85;ctx.fillRect(x-width/2,y-width/2,width,width);}
  else{ctx.beginPath();ctx.arc(x,y,kind==='hole'?r*.58:r,0,tau);
   if(kind==='zero'||kind==='hole'){ctx.lineWidth=1;ctx.strokeStyle=muted;ctx.stroke();}
   else{ctx.fillStyle=primary;ctx.fill();}}
  ctx.globalAlpha=1;
 }
 for(const m of drawn)paint(m);
 if(scene==='local'){const m=drawn.find(p=>p.index===v);paint(m);const [x,y]=m.p;ctx.fillStyle=bg;ctx.fillRect(x+8,y-16,43,15);ctx.fillStyle=fg;ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText('k='+v,x+9,y-5);}
 for(const l of labels)label(...l);
}
function rotate(dx,dy){yaw+=dx;pitch=Math.max(-.98,Math.min(.98,pitch+dy));render();}
el.scene.onchange=()=>{scene=el.scene.value;refresh();save();};
el.slider.oninput=()=>{degrees[scene]=Number(el.slider.value);refresh();};el.slider.onchange=save;
el.left.onclick=()=>{rotate(-.28,0);save();};el.right.onclick=()=>{rotate(.28,0);save();};
el.tilt.onclick=()=>{pitch=pitch>.65?-.16:pitch+.24;render();save();};
el.view.onpointerdown=e=>{drag=[e.clientX,e.clientY];el.view.setPointerCapture(e.pointerId);};
el.view.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];rotate(dx*.009,dy*.008);};
el.view.onpointerup=()=>{drag=null;save();};el.view.onpointercancel=()=>{drag=null;};
new ResizeObserver(render).observe(el.view);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)apply(e.detail.globals.widgetState);});
apply(window.openai?.widgetState);
})();
