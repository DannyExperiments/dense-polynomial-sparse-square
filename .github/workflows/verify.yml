name: Repository verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify evidence checksums
        run: sha256sum --check evidence/SHA256SUMS
      - name: Verify proof checksums and replay the certificate
        working-directory: proof
        run: |
          sha256sum --check SHA256SUMS
          sh verify.sh
