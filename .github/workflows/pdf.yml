name: PDF build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile the paper and bibliography
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcecc6c1b
        with:
          root_file: manuscript.tex
          working_directory: paper
          texlive_version: 2026
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
      - name: Check the freshly built PDF
        run: test -s paper/build/manuscript.pdf
